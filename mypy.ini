[mypy]
# Define lookup directories so mypy resolves sibling packages under services/
mypy_path = services/control-plane, services
explicit_package_bases = True
namespace_packages = True
warn_unused_configs = True
disallow_untyped_defs = True

# Ignore missing type stubs for untyped third-party libraries specifically
[mypy-ollama.*]
ignore_missing_imports = True

[mypy-valkey.*]
ignore_missing_imports = True

[mypy-falkordb.*]
ignore_missing_imports = True

[mypy-qdrant_client.*]
ignore_missing_imports = True

[mypy-structlog.*]
ignore_missing_imports = True

[mypy-celery.*]
ignore_missing_imports = True
